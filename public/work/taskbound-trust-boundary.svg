<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">TaskBound trust boundary</title>
  <desc id="desc">The authoritative user task and untrusted retrieved content enter the model. The model proposes an action. TaskBound checks six authorization dimensions before allowing a call to reach the tool runtime.</desc>
  <style>
    text{font-family:system-ui,sans-serif;fill:#111827;letter-spacing:0}.h{font-size:18px;font-weight:700}.s{font-size:13px;fill:#53606f}.box{fill:#fff;stroke:#cbd3de;stroke-width:2}.trusted{fill:#eef8f8;stroke:#087f8c}.untrusted{fill:#fff6e5;stroke:#9a6700}.gate{fill:#111827;stroke:#111827}.gateText{fill:#fff}.arrow{stroke:#53606f;stroke-width:2;fill:none;marker-end:url(#a)}.boundary{stroke:#a53a3a;stroke-width:2;stroke-dasharray:8 7}.label{font-size:12px;fill:#a53a3a;font-weight:700}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#53606f"/></marker></defs>
  <rect class="box trusted" x="20" y="48" width="190" height="92" rx="4"/><text class="h" x="38" y="82">Original user task</text><text class="s" x="38" y="108">Authoritative intent</text><text class="s" x="38" y="128">and delegation</text>
  <rect class="box untrusted" x="20" y="220" width="190" height="92" rx="4"/><text class="h" x="38" y="254">Retrieved content</text><text class="s" x="38" y="280">Untrusted data</text><text class="s" x="38" y="300">may contain injection</text>
  <rect class="box" x="282" y="119" width="190" height="112" rx="4"/><text class="h" x="312" y="158">LLM agent</text><text class="s" x="312" y="184">Non-authoritative</text><text class="s" x="312" y="204">action proposal</text>
  <line class="arrow" x1="210" y1="94" x2="282" y2="150"/><line class="arrow" x1="210" y1="266" x2="282" y2="202"/>
  <line class="boundary" x1="505" y1="25" x2="505" y2="335"/><text class="label" x="519" y="43">EXECUTION TRUST BOUNDARY</text>
  <rect class="gate" x="548" y="58" width="300" height="234" rx="4"/><text class="h gateText" x="574" y="92">TaskBound authorization gate</text>
  <text class="s gateText" x="574" y="126">Action</text><text class="s gateText" x="704" y="126">Destination</text>
  <text class="s gateText" x="574" y="160">Resource</text><text class="s gateText" x="704" y="160">Data</text>
  <text class="s gateText" x="574" y="194">Delegation</text><text class="s gateText" x="704" y="194">Scope</text>
  <line x1="574" y1="217" x2="820" y2="217" stroke="#52606f"/><text class="s gateText" x="574" y="246">Allow: execute and audit</text><text class="s gateText" x="574" y="272">Block: no effect, continue safely</text>
  <line class="arrow" x1="472" y1="175" x2="548" y2="175"/>
  <rect class="box trusted" x="905" y="119" width="195" height="112" rx="4"/><text class="h" x="932" y="158">Tool runtime</text><text class="s" x="932" y="184">Authorized external</text><text class="s" x="932" y="204">side effects only</text>
  <line class="arrow" x1="848" y1="175" x2="905" y2="175"/>
</svg>
